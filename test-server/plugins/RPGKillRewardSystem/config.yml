# ---------------------------------------------------------------------------
# RPG Kill Reward System
# ---------------------------------------------------------------------------
# When a player kills a mob, every reward configured for that mob is rolled.
# Text fields (name, lore, message) use MiniMessage: <red>, <bold>, <gradient:...>
# Reload with /killreward reload after editing this file.

settings:
  # true  = items go straight into the killer's inventory (overflow drops at their feet)
  # false = items drop on the ground where the mob died
  give-directly: true

  # Each level of Looting on the killer's weapon multiplies every reward's chance by
  # (1 + level * looting-bonus). 0.25 => Looting III = +75% chance. Set 0 to disable.
  looting-bonus: 0.25

  # Send the reward's "message" to the player when it drops.
  send-messages: true

# ---------------------------------------------------------------------------
# Mob rules. The id (e.g. "zombie") is just a label; "type" is the entity type
# (https://jd.papermc.io/paper/org/bukkit/entity/EntityType.html).
# If "type" is omitted the id is used as the type.
#
# Optional per-mob fields:
#   name: "Goblin"              only match mobs whose custom name contains this text
#                               (case-insensitive, formatting ignored) - handy for RPG mobs
#   clear-vanilla-drops: true   remove the mob's normal drops (and vanilla XP)
#
# Reward fields (all optional, combine freely):
#   chance: 25.0                percent chance, 0-100 (default 100)
#   item:                       material, amount (5 or "1-3"), name, lore, enchantments
#   commands:                   run as console. %player% %mob% %world% %x% %y% %z%
#   exp: "5-10"                 XP points given to the killer
#   message: "<green>..."       sent to the killer when the reward drops
# ---------------------------------------------------------------------------
mobs:
  zombie:
    type: ZOMBIE
    rewards:
      rotten_coins:
        chance: 60.0
        item:
          material: GOLD_NUGGET
          amount: "1-3"
          name: "<gold>Zombie Coin"
          lore:
            - "<gray>Dropped by a zombie."
        exp: "2-5"
      cursed_blade:
        chance: 2.5
        item:
          material: IRON_SWORD
          name: "<dark_red><bold>Cursed Blade"
          lore:
            - "<gray>Forged from rotting flesh."
          enchantments:
            sharpness: 3
            unbreaking: 2
        message: "<dark_red>The zombie dropped a <bold>Cursed Blade</bold>!"

  skeleton:
    type: SKELETON
    clear-vanilla-drops: false
    rewards:
      bone_dust:
        chance: 40.0
        item:
          material: BONE_MEAL
          amount: "2-4"
          name: "<white>Bone Dust"
      bounty:
        chance: 10.0
        commands:
          - "give %player% diamond 1"
        message: "<aqua>A skeleton bounty was paid out!"

  # Example of an RPG boss matched by custom name.
  goblin_king:
    type: ZOMBIE
    name: "Goblin King"
    clear-vanilla-drops: true
    rewards:
      crown:
        chance: 100.0
        item:
          material: GOLDEN_HELMET
          name: "<yellow><bold>Goblin King's Crown"
          enchantments:
            protection: 4
        exp: "100-150"
        message: "<yellow>You slew the Goblin King!"
      broadcast:
        chance: 100.0
        commands:
          - "say %player% has slain the Goblin King in %world%!"
